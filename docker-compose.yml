version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: library_catalog_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library_network

  web:
    build: .
    container_name: library_catalog_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      # ВАЖНО: Внутри Docker-сети вместо localhost мы пишем имя сервиса базы данных — postgres
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/library_catalog
      - API_V1_PREFIX=/api/v1
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
    networks:
      - library_network

volumes:
  postgres_data:

networks:
  library_network:
    driver: bridge